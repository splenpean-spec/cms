<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - AliExpress Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f5f5f5; }
        .aliexpress-red { color: #FF4747; }
        .aliexpress-bg-red { background-color: #FF4747; }
        .sidebar-link.active { background-color: #fff1f1; color: #FF4747; border-right: 4px solid #FF4747; }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; }
            .sidebar.active { transform: translateX(0); }
        }
    </style>
</head>
<body class="flex min-h-screen relative">
    <!-- Mobile Menu Toggle -->
    <button onclick="toggleSidebar()" class="md:hidden fixed bottom-6 right-6 z-[100] bg-black text-white p-4 rounded-full shadow-2xl">
        <i class="fas fa-bars text-xl"></i>
    </button>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar fixed md:static inset-y-0 left-0 w-64 bg-white border-r shadow-sm z-50">
        <div class="p-6 flex items-center justify-between">
            <h1 class="text-xl md:text-2xl font-bold italic tracking-tighter aliexpress-red">AliExpress Admin</h1>
            <button onclick="toggleSidebar()" class="md:hidden text-gray-400">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <nav class="mt-6">
            <button onclick="showTab('products')" id="productsTab" class="sidebar-link w-full flex items-center gap-4 px-6 py-4 text-gray-600 hover:bg-gray-50 transition-all active">
                <i class="fas fa-box"></i>
                <span class="font-bold text-sm">Products</span>
            </button>
            <button onclick="showTab('orders')" id="ordersTab" class="sidebar-link w-full flex items-center gap-4 px-6 py-4 text-gray-600 hover:bg-gray-50 transition-all">
                <i class="fas fa-shopping-bag"></i>
                <span class="font-bold text-sm">Orders</span>
            </button>
            <button onclick="showTab('settings')" id="settingsTab" class="sidebar-link w-full flex items-center gap-4 px-6 py-4 text-gray-600 hover:bg-gray-50 transition-all">
                <i class="fas fa-cog"></i>
                <span class="font-bold text-sm">Settings</span>
            </button>
            <div class="px-6 py-8 mt-auto">
                <button onclick="logout()" class="w-full flex items-center gap-4 text-red-500 hover:text-red-700 transition-all">
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="font-bold text-sm">Logout</span>
                </button>
            </div>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-grow p-4 md:p-8">
        <header class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-8">
            <h2 id="tabTitle" class="text-xl md:text-2xl font-bold text-gray-800">Manage Products</h2>
            <button id="addBtn" onclick="openProductModal()" class="aliexpress-bg-red text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:bg-red-600 transition-all w-full md:w-auto text-sm">
                <i class="fas fa-plus mr-2"></i> Add New Product
            </button>
        </header>

        <!-- Products Table -->
        <div id="productsView" class="bg-white rounded-2xl shadow-sm border overflow-x-auto">
            <table class="w-full text-left min-w-[800px]">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="px-6 py-4 font-bold text-xs text-gray-500">Image</th>
                        <th class="px-6 py-4 font-bold text-xs text-gray-500">Name</th>
                        <th class="px-6 py-4 font-bold text-xs text-gray-500">Price</th>
                        <th class="px-6 py-4 font-bold text-xs text-gray-500">Quantity</th>
                        <th class="px-6 py-4 font-bold text-xs text-gray-500">Category</th>
                        <th class="px-6 py-4 font-bold text-xs text-gray-500 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="productsList">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>

        <!-- Orders Table (Hidden by default) -->
        <div id="ordersView" class="hidden bg-white rounded-2xl shadow-sm border overflow-x-auto">
            <table class="w-full text-left min-w-[800px]">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="px-6 py-4 font-bold text-xs text-gray-500">Order ID</th>
                        <th class="px-6 py-4 font-bold text-xs text-gray-500">Customer</th>
                        <th class="px-6 py-4 font-bold text-xs text-gray-500">Total</th>
                        <th class="px-6 py-4 font-bold text-xs text-gray-500">Status</th>
                        <th class="px-6 py-4 font-bold text-xs text-gray-500">Date</th>
                    </tr>
                </thead>
                <tbody id="ordersList">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>

        <!-- Settings View -->
        <div id="settingsView" class="hidden max-w-md mx-auto">
            <div class="bg-white rounded-2xl shadow-sm border p-8">
                <h3 class="text-xl font-bold mb-6">Change Admin Password</h3>
                <form id="changePasswordForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold mb-1">Current Password</label>
                        <input type="password" id="currentPassword" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-red-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">New Password</label>
                        <input type="password" id="newPassword" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-red-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">Confirm New Password</label>
                        <input type="password" id="confirmNewPassword" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-red-500 outline-none">
                    </div>
                    <button type="submit" class="w-full aliexpress-bg-red text-white font-bold py-3 rounded-xl hover:bg-red-600 transition-all">
                        Update Password
                    </button>
                </form>
                <p id="passwordMessage" class="mt-4 text-center text-sm font-medium"></p>
            </div>
        </div>
    </main>

    <!-- Product Modal -->
    <div id="productModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-xl p-8 shadow-2xl relative">
            <button onclick="closeProductModal()" class="absolute top-4 right-4 text-gray-400 hover:text-black">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h3 id="modalTitle" class="text-xl font-bold mb-6">Add New Product</h3>
            <form id="productForm" class="space-y-4">
                <input type="hidden" id="productId">
                <div>
                    <label class="block text-sm font-bold mb-1">Product Name</label>
                    <input type="text" id="name" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-red-500 outline-none">
                </div>
                <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-bold mb-1">Price ($)</label>
                            <input type="number" id="price" step="0.01" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-red-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">Quantity</label>
                            <input type="number" id="quantity" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-red-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">Category</label>
                            <input type="text" id="category" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-red-500 outline-none">
                        </div>
                    </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Product Image</label>
                    <input type="file" id="image" accept="image/*" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-red-500 outline-none">
                    <p id="imageStatus" class="text-[10px] text-gray-400 mt-1 italic"></p>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Available Colors (comma separated)</label>
                    <input type="text" id="colors" placeholder="e.g. Red, Blue, Black" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Description</label>
                    <textarea id="description" rows="3" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-red-500 outline-none"></textarea>
                </div>
                <button type="submit" class="w-full aliexpress-bg-red text-white font-bold py-3 rounded-xl hover:bg-red-600 transition-all">
                    Save Product
                </button>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('adminToken');
        if (!token) window.location.href = 'admin-login.html';

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function showTab(tab) {
            if (window.innerWidth < 768) toggleSidebar();
            document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
            document.getElementById(tab + 'Tab').classList.add('active');
            
            document.getElementById('productsView').classList.toggle('hidden', tab !== 'products');
            document.getElementById('ordersView').classList.toggle('hidden', tab !== 'orders');
            document.getElementById('settingsView').classList.toggle('hidden', tab !== 'settings');

            document.getElementById('tabTitle').textContent = 
                tab === 'products' ? 'Manage Products' : 
                tab === 'orders' ? 'Order History' : 'Account Settings';
            
            document.getElementById('addBtn').classList.toggle('hidden', tab !== 'products');

            if (tab === 'products') fetchProducts();
            else if (tab === 'orders') fetchOrders();
        }

        async function fetchProducts() {
            const res = await fetch('/api/products');
            const products = await res.json();
            const list = document.getElementById('productsList');
            list.innerHTML = products.map(p => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="px-6 py-4"><img src="${p.image}" class="w-12 h-12 object-cover rounded"></td>
                    <td class="px-6 py-4 font-medium">${p.name}</td>
                    <td class="px-6 py-4">$ ${p.price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 rounded-full text-xs font-bold ${p.quantity > 10 ? 'bg-green-100 text-green-700' : p.quantity > 0 ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700'}">
                            ${p.quantity} in stock
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-500">${p.category || 'N/A'}</td>
                    <td class="px-6 py-4">
                        <div class="flex gap-3">
                            <button onclick='editProduct(${JSON.stringify(p)})' class="text-blue-500 hover:text-blue-700"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteProduct(${p.id})" class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function fetchOrders() {
            const res = await fetch('/api/orders', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const orders = await res.json();
            const list = document.getElementById('ordersList');
            list.innerHTML = orders.map(o => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="px-6 py-4 font-bold text-sm">#ORD-${o.id}</td>
                    <td class="px-6 py-4 text-sm">${o.customerName || 'Guest'}</td>
                    <td class="px-6 py-4 font-bold">$ ${o.totalAmount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 rounded-full text-[10px] font-bold uppercase ${o.status === 'Completed' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
                            ${o.status}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-400">${new Date(o.createdAt).toLocaleDateString()}</td>
                </tr>
            `).join('');
        }

        function openProductModal(p = null) {
            document.getElementById('productModal').classList.remove('hidden');
            document.getElementById('modalTitle').textContent = p ? 'Edit Product' : 'Add New Product';
            document.getElementById('productId').value = p ? p.id : '';
            document.getElementById('name').value = p ? p.name : '';
            document.getElementById('price').value = p ? p.price : '';
            document.getElementById('quantity').value = p ? p.quantity : '0';
            document.getElementById('category').value = p ? p.category : '';
            document.getElementById('image').value = '';
            document.getElementById('imageStatus').textContent = p ? 'Keep empty to maintain current image' : '';
            document.getElementById('colors').value = p ? (p.colors || '') : '';
            document.getElementById('description').value = p ? p.description : '';
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const formData = new FormData();
            
            formData.append('name', document.getElementById('name').value);
            formData.append('price', document.getElementById('price').value);
            formData.append('quantity', document.getElementById('quantity').value);
            formData.append('category', document.getElementById('category').value);
            formData.append('colors', document.getElementById('colors').value);
            formData.append('description', document.getElementById('description').value);
            
            const imageFile = document.getElementById('image').files[0];
            if (imageFile) {
                formData.append('image', imageFile);
            }

            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/products/${id}` : '/api/products';

            const res = await fetch(url, {
                method,
                headers: { 
                    'Authorization': 'Bearer ' + token 
                },
                body: formData
            });

            if (res.ok) {
                closeProductModal();
                fetchProducts();
            } else {
                alert('Error saving product');
            }
        });

        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            const res = await fetch(`/api/products/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) fetchProducts();
        }

        // Change Password Logic
        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;
            const messageEl = document.getElementById('passwordMessage');

            if (newPassword !== confirmNewPassword) {
                messageEl.className = 'mt-4 text-center text-sm font-medium text-red-600';
                messageEl.textContent = 'New passwords do not match';
                return;
            }

            try {
                const res = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ currentPassword, newPassword })
                });

                const data = await res.json();

                if (res.ok) {
                    messageEl.className = 'mt-4 text-center text-sm font-medium text-green-600';
                    messageEl.textContent = 'Password updated successfully!';
                    e.target.reset();
                } else {
                    messageEl.className = 'mt-4 text-center text-sm font-medium text-red-600';
                    messageEl.textContent = data.message || 'Error updating password';
                }
            } catch (error) {
                messageEl.className = 'mt-4 text-center text-sm font-medium text-red-600';
                messageEl.textContent = 'Connection error';
            }
        });

        function editProduct(p) {
            openProductModal(p);
        }

        function logout() {
            localStorage.removeItem('adminToken');
            window.location.href = 'admin-login.html';
        }

        // Initial Load
        fetchProducts();
    </script>
</body>
</html>
