<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - AliExpress Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #f5f5f5; }
        .aliexpress-red { color: #FF4747; }
        .aliexpress-bg-red { background-color: #FF4747; }
        .sidebar-link.active { background-color: #fff1f1; color: #FF4747; border-right: 4px solid #FF4747; }
    </style>
</head>
<body class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r shadow-sm">
        <div class="p-6">
            <h1 class="text-2xl font-bold italic tracking-tighter aliexpress-red">AliExpress Admin</h1>
        </div>
        <nav class="mt-6">
            <button onclick="showTab('products')" id="productsTab" class="sidebar-link w-full flex items-center gap-4 px-6 py-4 text-gray-600 hover:bg-gray-50 transition-all active">
                <i class="fas fa-box"></i>
                <span class="font-bold">Products</span>
            </button>
            <button onclick="showTab('orders')" id="ordersTab" class="sidebar-link w-full flex items-center gap-4 px-6 py-4 text-gray-600 hover:bg-gray-50 transition-all">
                <i class="fas fa-shopping-bag"></i>
                <span class="font-bold">Orders</span>
            </button>
            <button onclick="logout()" class="w-full flex items-center gap-4 px-6 py-4 text-red-500 hover:bg-red-50 mt-auto transition-all">
                <i class="fas fa-sign-out-alt"></i>
                <span class="font-bold">Logout</span>
            </button>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-grow p-8">
        <header class="flex justify-between items-center mb-8">
            <h2 id="tabTitle" class="text-2xl font-bold text-gray-800">Manage Products</h2>
            <button id="addBtn" onclick="openProductModal()" class="aliexpress-bg-red text-white px-6 py-2 rounded-xl font-bold shadow-lg hover:bg-red-600 transition-all">
                <i class="fas fa-plus mr-2"></i> Add New Product
            </button>
        </header>

        <!-- Products Table -->
        <div id="productsView" class="bg-white rounded-2xl shadow-sm border overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="px-6 py-4 font-bold text-sm text-gray-500">Image</th>
                        <th class="px-6 py-4 font-bold text-sm text-gray-500">Name</th>
                        <th class="px-6 py-4 font-bold text-sm text-gray-500">Price</th>
                        <th class="px-6 py-4 font-bold text-sm text-gray-500">Category</th>
                        <th class="px-6 py-4 font-bold text-sm text-gray-500">Actions</th>
                    </tr>
                </thead>
                <tbody id="productsList">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>

        <!-- Orders Table (Hidden by default) -->
        <div id="ordersView" class="hidden bg-white rounded-2xl shadow-sm border overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="px-6 py-4 font-bold text-sm text-gray-500">Order ID</th>
                        <th class="px-6 py-4 font-bold text-sm text-gray-500">Customer</th>
                        <th class="px-6 py-4 font-bold text-sm text-gray-500">Total</th>
                        <th class="px-6 py-4 font-bold text-sm text-gray-500">Status</th>
                        <th class="px-6 py-4 font-bold text-sm text-gray-500">Date</th>
                    </tr>
                </thead>
                <tbody id="ordersList">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Product Modal -->
    <div id="productModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-xl p-8 shadow-2xl relative">
            <button onclick="closeProductModal()" class="absolute top-4 right-4 text-gray-400 hover:text-black">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h3 id="modalTitle" class="text-xl font-bold mb-6">Add New Product</h3>
            <form id="productForm" class="space-y-4">
                <input type="hidden" id="productId">
                <div>
                    <label class="block text-sm font-bold mb-1">Product Name</label>
                    <input type="text" id="name" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-red-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold mb-1">Price ($)</label>
                            <input type="number" id="price" step="0.01" required class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-red-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-1">Category</label>
                            <input type="text" id="category" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-red-500 outline-none">
                        </div>
                    </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Image URL</label>
                    <input type="text" id="image" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-red-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Description</label>
                    <textarea id="description" rows="3" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-red-500 outline-none"></textarea>
                </div>
                <button type="submit" class="w-full aliexpress-bg-red text-white font-bold py-3 rounded-xl hover:bg-red-600 transition-all">
                    Save Product
                </button>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('adminToken');
        if (!token) window.location.href = 'admin-login.html';

        function showTab(tab) {
            document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
            document.getElementById(tab + 'Tab').classList.add('active');
            
            document.getElementById('productsView').classList.toggle('hidden', tab !== 'products');
            document.getElementById('ordersView').classList.toggle('hidden', tab !== 'orders');
            document.getElementById('tabTitle').textContent = tab === 'products' ? 'Manage Products' : 'Order History';
            document.getElementById('addBtn').classList.toggle('hidden', tab !== 'products');

            if (tab === 'products') fetchProducts();
            else fetchOrders();
        }

        async function fetchProducts() {
            const res = await fetch('/api/products');
            const products = await res.json();
            const list = document.getElementById('productsList');
            list.innerHTML = products.map(p => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="px-6 py-4"><img src="${p.image}" class="w-12 h-12 object-cover rounded"></td>
                    <td class="px-6 py-4 font-medium">${p.name}</td>
                    <td class="px-6 py-4">$ ${p.price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td class="px-6 py-4 text-sm text-gray-500">${p.category || 'N/A'}</td>
                    <td class="px-6 py-4">
                        <div class="flex gap-3">
                            <button onclick='editProduct(${JSON.stringify(p)})' class="text-blue-500 hover:text-blue-700"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteProduct(${p.id})" class="text-red-500 hover:text-red-700"><i class="fas fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function fetchOrders() {
            const res = await fetch('/api/orders', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const orders = await res.json();
            const list = document.getElementById('ordersList');
            list.innerHTML = orders.map(o => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="px-6 py-4 font-bold text-sm">#ORD-${o.id}</td>
                    <td class="px-6 py-4 text-sm">${o.customerName || 'Guest'}</td>
                    <td class="px-6 py-4 font-bold">$ ${o.totalAmount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 rounded-full text-[10px] font-bold uppercase ${o.status === 'Completed' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
                            ${o.status}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-400">${new Date(o.createdAt).toLocaleDateString()}</td>
                </tr>
            `).join('');
        }

        function openProductModal(p = null) {
            document.getElementById('productModal').classList.remove('hidden');
            document.getElementById('modalTitle').textContent = p ? 'Edit Product' : 'Add New Product';
            document.getElementById('productId').value = p ? p.id : '';
            document.getElementById('name').value = p ? p.name : '';
            document.getElementById('price').value = p ? p.price : '';
            document.getElementById('category').value = p ? p.category : '';
            document.getElementById('image').value = p ? p.image : '';
            document.getElementById('description').value = p ? p.description : '';
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const data = {
                name: document.getElementById('name').value,
                price: parseFloat(document.getElementById('price').value),
                category: document.getElementById('category').value,
                image: document.getElementById('image').value,
                description: document.getElementById('description').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/products/${id}` : '/api/products';

            const res = await fetch(url, {
                method,
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token 
                },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                closeProductModal();
                fetchProducts();
            } else {
                alert('Error saving product');
            }
        });

        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            const res = await fetch(`/api/products/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) fetchProducts();
        }

        function editProduct(p) {
            openProductModal(p);
        }

        function logout() {
            localStorage.removeItem('adminToken');
            window.location.href = 'admin-login.html';
        }

        // Initial Load
        fetchProducts();
    </script>
</body>
</html>
